<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="860" height="110">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Scanning Radar Laser Bar -->
    <linearGradient id="hudBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes hudSweep {
      0% { transform: translateX(-860px); }
      100% { transform: translateX(860px); }
    }
    .sweep-line {
      animation: hudSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes liveBeacon {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .beacon-dot {
      transform-origin: 22px 16px;
      animation: liveBeacon 2s ease-in-out infinite;
    }

    .reticle { stroke: #334155; stroke-width: 1.2; fill: none; }
    
    .nav-btn {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .nav-btn:hover rect {
      stroke: #38bdf8;
      fill-opacity: 0.2;
    }
    .nav-btn:hover text {
      fill: #ffffff;
    }
  </style>

  <!-- Frame Background Plate -->
  <rect x="1" y="1" width="858" height="108" rx="8" fill="url(#hudBgGrad)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Animated Horizon Laser -->
  <line x1="0" y1="30" x2="280" y2="30" stroke="url(#hudBeam)" stroke-width="1.2" class="sweep-line" />

  <!-- Corner Brackets -->
  <path d="M 1 12 L 1 1 L 12 1" class="reticle" />
  <path d="M 847 1 L 859 1 L 859 12" class="reticle" />
  <path d="M 859 97 L 859 109 L 847 109" class="reticle" />
  <path d="M 12 109 L 1 109 L 1 97" class="reticle" />

  <!-- Top Micro Telemetry Strip -->
  <circle cx="22" cy="16" r="3.5" fill="#38bdf8" class="beacon-dot" />
  <circle cx="22" cy="16" r="1.5" fill="#ffffff" />
  <text x="34" y="19.5" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2px">MISSION_CONTROL // FAST_NAVIGATION_INDEX</text>
  
  <text x="840" y="19.5" text-anchor="end" class="mono" font-size="9" fill="#94a3b8" letter-spacing="0.5px">AUTHENTICATED: DEV_VASU // PORT 443</text>

  <!-- Divider Line -->
  <path d="M 1 30 L 859 30" stroke="#1e293b" stroke-width="0.8" />

  <!-- Navigation Grid (6 Buttons) -->
  
  <!-- 01 TELEMETRY -->
  <a href="#telemetry" target="_self" class="nav-btn">
    <g transform="translate(16, 44)">
      <rect width="130" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 01</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#38bdf8">&#x1F6F0;&#xFE0E; TELEMETRY</text>
    </g>
  </a>

  <!-- 02 ARSENAL -->
  <a href="#neural-arsenal" target="_self" class="nav-btn">
    <g transform="translate(156, 44)">
      <rect width="130" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 02</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#cbd5e1">&#x1F9EC; ARSENAL</text>
    </g>
  </a>

  <!-- 03 TROPHIES -->
  <a href="#achievements" target="_self" class="nav-btn">
    <g transform="translate(296, 44)">
      <rect width="130" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 03</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#f8fafc">&#x1F3C6; TROPHIES</text>
    </g>
  </a>

  <!-- 04 SYSTEMS -->
  <a href="#flagship-systems" target="_self" class="nav-btn">
    <g transform="translate(436, 44)">
      <rect width="130" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 04</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#38bdf8">&#x26A1; SYSTEMS</text>
    </g>
  </a>

  <!-- 05 METRICS -->
  <a href="#quantum-metrics" target="_self" class="nav-btn">
    <g transform="translate(576, 44)">
      <rect width="130" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 05</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#cbd5e1">&#x1F4CA; METRICS</text>
    </g>
  </a>

  <!-- 06 UPLINK -->
  <a href="#encrypted-uplink" target="_self" class="nav-btn">
    <g transform="translate(716, 44)">
      <rect width="128" height="46" rx="5" fill="url(#btnGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b">SECTOR 06</text>
      <text x="12" y="34" class="mono" font-size="11" font-weight="700" fill="#fda4af">&#x1F4EC; UPLINK</text>
    </g>
  </a>
</svg>
