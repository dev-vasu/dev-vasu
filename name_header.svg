<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <!-- Matte Metallic Titanium to Cool Ice-White Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Refined Slate Subtitle -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Deep Ambient Glow (Zero harsh bloom) -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 36px;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: url(#titaniumGrad);
      filter: url(#softShadow);
    }
    .sub-text {
      font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: url(#slateGrad);
    }
    .status-text {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #64748b;
    }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .pulse { animation: subtlePulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Clean Precision Tech Accents (Titanium Slate) -->
  <path d="M 15 28 L 15 14 L 29 14" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6" />
  <path d="M 785 28 L 785 14 L 771 14" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6" />
  <line x1="35" y1="14" x2="180" y2="14" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="620" y1="14" x2="765" y2="14" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />

  <!-- Status Indicator: Crisp Emerald Ping -->
  <g transform="translate(400, 22)">
    <circle cx="-168" cy="-3" r="3" fill="#10b981" class="pulse" />
    <text x="0" y="0" text-anchor="middle" class="status-text">SYSTEM_NODE::ONLINE // GREYORANGE_CORE</text>
  </g>

  <!-- Clean Titanium Main Typography -->
  <text x="400" y="66" text-anchor="middle" class="title-text">VASUDEV SINGH JAMWAL</text>

  <!-- Subtitle -->
  <text x="400" y="92" text-anchor="middle" class="sub-text">SOFTWARE SUPPORT ENGINEER @ GREYORANGE • AI/ML • GURUGRAM 🇮🇳</text>

  <!-- Minimal Hairline Dividing Rail -->
  <line x1="200" y1="106" x2="600" y2="106" stroke="#334155" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="106" r="2" fill="#64748b" />
</svg>
