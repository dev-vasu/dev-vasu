<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <!-- Cyan to Electric Indigo/Violet Gradient -->
    <linearGradient id="cyberNeonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Subtle Light -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Clean Glow -->
    <filter id="neonSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 5px;
      text-transform: uppercase;
      fill: url(#cyberNeonGrad);
      filter: url(#neonSoftGlow);
    }
    .sub-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      fill: url(#subGrad);
    }
    .status-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #00f0ff;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.3; }
    }
    .pulse { animation: pulseDot 2s ease-in-out infinite; }
  </style>

  <!-- Top Corner Tech Accents -->
  <path d="M 15 28 L 15 14 L 30 14" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.8" />
  <path d="M 785 28 L 785 14 L 770 14" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.8" />
  <line x1="36" y1="14" x2="160" y2="14" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
  <line x1="640" y1="14" x2="764" y2="14" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Live Node Status Indicator -->
  <g transform="translate(400, 22)">
    <circle cx="-168" cy="-3.5" r="3.5" fill="#10b981" class="pulse" />
    <text x="0" y="0" text-anchor="middle" class="status-text">SYSTEM_NODE::ONLINE // GREYORANGE_CORE</text>
  </g>

  <!-- Main Cyberpunk Stylized Name -->
  <text x="400" y="68" text-anchor="middle" class="title-text">VASUDEV SINGH JAMWAL</text>

  <!-- Futuristic Subtitle -->
  <text x="400" y="94" text-anchor="middle" class="sub-text">SOFTWARE SUPPORT ENGINEER @ GREYORANGE • AI/ML • GURUGRAM 🇮🇳</text>

  <!-- Bottom Tech Divider -->
  <line x1="160" y1="108" x2="640" y2="108" stroke="url(#cyberNeonGrad)" stroke-width="1.2" opacity="0.6" />
  <circle cx="400" cy="108" r="2.5" fill="#00f0ff" />
  <circle cx="160" cy="108" r="1.5" fill="#00f0ff" />
  <circle cx="640" cy="108" r="1.5" fill="#c084fc" />
</svg>
