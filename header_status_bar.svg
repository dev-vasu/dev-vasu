<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 62" width="860" height="62">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Scanning Radar Laser Bar -->
    <linearGradient id="navBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes navSweep {
      0% { transform: translateX(-860px); }
      100% { transform: translateX(860px); }
    }
    .sweep-line {
      animation: navSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes liveBeacon {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .beacon-dot {
      transform-origin: 22px 14px;
      animation: liveBeacon 2s ease-in-out infinite;
    }

    .reticle { stroke: #334155; stroke-width: 1.2; fill: none; }
  </style>

  <!-- Frame Background Plate -->
  <rect x="1" y="1" width="858" height="60" rx="8" fill="url(#navBgGrad)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Animated Horizon Laser -->
  <line x1="0" y1="24" x2="300" y2="24" stroke="url(#navBeam)" stroke-width="1.2" class="sweep-line" />

  <!-- Corner Brackets -->
  <path d="M 1 10 L 1 1 L 10 1" class="reticle" />
  <path d="M 849 1 L 859 1 L 859 10" class="reticle" />
  <path d="M 859 51 L 859 61 L 849 61" class="reticle" />
  <path d="M 10 61 L 1 61 L 1 51" class="reticle" />

  <!-- Top Micro Telemetry Strip -->
  <circle cx="22" cy="13" r="3.5" fill="#38bdf8" class="beacon-dot" />
  <circle cx="22" cy="13" r="1.5" fill="#ffffff" />
  <text x="34" y="16.5" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1px">HUD_QUICK_COMMAND // SYS_ONLINE</text>
  
  <text x="840" y="16.5" text-anchor="end" class="mono" font-size="8.5" fill="#94a3b8" letter-spacing="0.5px">AUTHENTICATED: DEV_VASU // PORT 443</text>

  <path d="M 1 24 L 859 24" stroke="#1e293b" stroke-width="0.8" />

  <!-- Key Telemetry Items / Quick Access Row -->
  
  <!-- Item 1: Digital ID -->
  <g transform="translate(18, 32)">
    <text x="0" y="17" class="mono" font-size="9.5" font-weight="700" fill="#64748b">01 // </text>
    <text x="30" y="17" class="sans" font-size="11.5" font-weight="700" fill="#38bdf8">Digital ID Hub</text>
  </g>

  <line x1="165" y1="30" x2="165" y2="54" stroke="#1e293b" stroke-width="1" />

  <!-- Item 2: LinkedIn -->
  <g transform="translate(185, 32)">
    <text x="0" y="17" class="mono" font-size="9.5" font-weight="700" fill="#64748b">02 // </text>
    <text x="30" y="17" class="sans" font-size="11.5" font-weight="700" fill="#cbd5e1">LinkedIn Network</text>
  </g>

  <line x1="335" y1="30" x2="335" y2="54" stroke="#1e293b" stroke-width="1" />

  <!-- Item 3: X Transmission -->
  <g transform="translate(355, 32)">
    <text x="0" y="17" class="mono" font-size="9.5" font-weight="700" fill="#64748b">03 // </text>
    <text x="30" y="17" class="sans" font-size="11.5" font-weight="700" fill="#f8fafc">X Pulse</text>
  </g>

  <line x1="455" y1="30" x2="455" y2="54" stroke="#1e293b" stroke-width="1" />

  <!-- Item 4: Instagram -->
  <g transform="translate(475, 32)">
    <text x="0" y="17" class="mono" font-size="9.5" font-weight="700" fill="#64748b">04 // </text>
    <text x="30" y="17" class="sans" font-size="11.5" font-weight="700" fill="#fda4af">Optic Feed</text>
  </g>

  <line x1="590" y1="30" x2="590" y2="54" stroke="#1e293b" stroke-width="1" />

  <!-- Item 5: Location / Status -->
  <g transform="translate(610, 32)">
    <text x="0" y="17" class="mono" font-size="9.5" font-weight="700" fill="#64748b">LOC // </text>
    <text x="44" y="17" class="mono" font-size="11" font-weight="600" fill="#94a3b8">GURUGRAM, IN</text>
  </g>
</svg>
