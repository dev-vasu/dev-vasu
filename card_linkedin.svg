<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 125" width="420" height="125">
  <defs>
    <linearGradient id="bgGrad_02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="scanBeam_02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .beacon {
      transform-origin: 395px 20px;
      animation: beaconPulse 2.4s ease-in-out infinite;
    }

    @keyframes radarSweep {
      0% { transform: translateX(-420px); }
      100% { transform: translateX(420px); }
    }
    .radar-line {
      animation: radarSweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .reticle { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Card Background Plate -->
  <rect x="1" y="1" width="418" height="123" rx="8" fill="url(#bgGrad_02)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Scanning Laser Bar -->
  <line x1="0" y1="32" x2="160" y2="32" stroke="url(#scanBeam_02)" stroke-width="1.5" class="radar-line" />

  <!-- Corner Brackets -->
  <path d="M 1 12 L 1 1 L 12 1" class="reticle" />
  <path d="M 407 1 L 419 1 L 419 12" class="reticle" />
  <path d="M 419 113 L 419 124 L 407 124" class="reticle" />
  <path d="M 12 124 L 1 124 L 1 113" class="reticle" />

  <!-- Top Status Header -->
  <path d="M 1 32 L 419 32" stroke="#1e293b" stroke-width="0.8" />
  
  <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.2px">NODE // 02</text>
  
  <!-- Status Badge Pill -->
  <rect x="90" y="11" width="105" height="15" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.8" />
  <text x="142.5" y="22" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1px">ENTERPRISE</text>

  <!-- Live Pulsing Sensor Light -->
  <circle cx="395" cy="20" r="4.5" fill="#38bdf8" class="beacon" />
  <circle cx="395" cy="20" r="2" fill="#ffffff" />

  <!-- Card Body: Icon & Titles -->
  <g transform="translate(18, 46)">
    <g fill="#0a66c2">
          <rect x="0" y="0" width="22" height="22" rx="4" fill="#0a66c2" />
          <text x="11" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">in</text>
        </g>
  </g>

  <g transform="translate(60, 46)">
    <text x="0" y="13" class="sans" font-size="14.5" font-weight="700" fill="#f8fafc" letter-spacing="0.3px">LINKEDIN NETWORK</text>
    <text x="0" y="28" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">in/vasudev-singh-jamwal</text>
    <text x="0" y="42" class="mono" font-size="9" fill="#64748b">Support Engineering + Infrastructure</text>
  </g>

  <!-- Interactive Action Pill (Simulated Button) -->
  <g transform="translate(255, 84)">
    <rect x="0" y="0" width="148" height="26" rx="4" fill="rgba(56, 189, 248, 0.14)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
    <text x="74" y="17" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.5px">CONNECT ON LINKEDIN &#8594;</text>
  </g>
</svg>