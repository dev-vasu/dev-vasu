<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 38" width="860" height="38">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="stripBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    @keyframes stripSweep {
      0% { transform: translateX(-860px); }
      100% { transform: translateX(860px); }
    }
    .sweep { animation: stripSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes beacon {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .beacon-light {
      transform-origin: 20px 19px;
      animation: beacon 2s ease-in-out infinite;
    }
  </style>

  <rect x="1" y="1" width="858" height="36" rx="6" fill="url(#stripBg)" stroke="#1e293b" stroke-width="1.2" />
  <line x1="0" y1="36" x2="280" y2="36" stroke="url(#stripBeam)" stroke-width="1.2" class="sweep" />

  <circle cx="20" cy="19" r="3.5" fill="#38bdf8" class="beacon-light" />
  <circle cx="20" cy="19" r="1.5" fill="#ffffff" />
  
  <text x="32" y="23" class="mono" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.2px">MISSION_CONTROL // FAST_NAVIGATION_DECK</text>
  <text x="840" y="23" text-anchor="end" class="mono" font-size="9" fill="#94a3b8" letter-spacing="0.5px">AUTHENTICATED: DEV_VASU // PORT 443</text>
</svg>
