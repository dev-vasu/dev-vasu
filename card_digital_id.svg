<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120">
  <defs>
    <linearGradient id="bgGrad_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="scanBeam_main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .beacon {
      transform-origin: 835px 20px;
      animation: beaconPulse 2.4s ease-in-out infinite;
    }

    @keyframes radarSweep {
      0% { transform: translateX(-860px); }
      100% { transform: translateX(860px); }
    }
    .radar-line {
      animation: radarSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .reticle { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background Plate -->
  <rect x="1" y="1" width="858" height="118" rx="8" fill="url(#bgGrad_main)" stroke="#334155" stroke-width="1.2" />

  <!-- Scanning Laser Bar -->
  <line x1="0" y1="32" x2="280" y2="32" stroke="url(#scanBeam_main)" stroke-width="1.2" class="radar-line" />

  <!-- Corner Brackets -->
  <path d="M 1 14 L 1 1 L 14 1" class="reticle" />
  <path d="M 845 1 L 859 1 L 859 14" class="reticle" />
  <path d="M 859 105 L 859 119 L 845 119" class="reticle" />
  <path d="M 14 119 L 1 119 L 1 105" class="reticle" />

  <!-- Header Divider -->
  <path d="M 1 32 L 859 32" stroke="#1e293b" stroke-width="0.8" />
  
  <text x="20" y="21" class="mono" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5px">PRIMARY TRANSMISSION HUB // NODE 01</text>
  
  <!-- Status Badge Pill -->
  <rect x="330" y="11" width="120" height="15" rx="3" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.8" />
  <text x="390" y="22" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1px">FLAGSHIP IDENTITY</text>

  <!-- Beacon Status Light -->
  <circle cx="835" cy="20" r="4" fill="#38bdf8" class="beacon" />
  <circle cx="835" cy="20" r="1.8" fill="#ffffff" />

  <!-- Icon Section -->
  <g transform="translate(24, 46)" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="34" height="22" rx="4" stroke="#38bdf8" stroke-opacity="0.8" />
    <circle cx="10" cy="11" r="4" />
    <path d="M 19 8 L 27 8 M 19 13 L 25 13" />
  </g>

  <!-- Content Section -->
  <g transform="translate(74, 46)">
    <text x="0" y="14" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.3px">CYBER DIGITAL ID PORTFOLIO</text>
    <text x="0" y="30" class="mono" font-size="11.5" font-weight="600" fill="#38bdf8">dev-vasu.github.io/digital-id</text>
    <text x="0" y="44" class="mono" font-size="9.5" fill="#64748b">Interactive 3D WebGL Physics Canvas &amp; Custom Kinetic FakeScroll Driver</text>
  </g>

  <!-- Launch Button Pill -->
  <g transform="translate(685, 52)">
    <rect x="0" y="0" width="150" height="30" rx="5" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="75" y="19" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#f8fafc" letter-spacing="0.5px">INITIALIZE NODE &#8594;</text>
  </g>
</svg>