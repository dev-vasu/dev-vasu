<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 46" width="340" height="46">
  <defs>
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="flagBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes flagSweep {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(340px); }
    }
    .sweep { animation: flagSweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .beacon {
      transform-origin: 320px 14px;
      animation: beaconPulse 2s ease-in-out infinite;
    }
  </style>

  <!-- Base Plate -->
  <rect x="1" y="1" width="338" height="44" rx="6" fill="url(#flagBg)" stroke="#334155" stroke-width="1.2" />
  
  <!-- Laser Sweep -->
  <line x1="0" y1="20" x2="120" y2="20" stroke="url(#flagBeam)" stroke-width="1.2" class="sweep" />

  <!-- Corner Reticles -->
  <path d="M 1 8 L 1 1 L 8 1" stroke="#38bdf8" stroke-width="1.2" fill="none" />
  <path d="M 332 1 L 339 1 L 339 8" stroke="#38bdf8" stroke-width="1.2" fill="none" />
  <path d="M 339 38 L 339 45 L 332 45" stroke="#38bdf8" stroke-width="1.2" fill="none" />
  <path d="M 8 45 L 1 45 L 1 38" stroke="#38bdf8" stroke-width="1.2" fill="none" />

  <!-- Icon: 3D ID Badge Vector -->
  <g transform="translate(14, 11)" stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="26" height="18" rx="3" />
    <circle cx="8" cy="11" r="3" />
    <path d="M 15 9 L 21 9 M 15 13 L 19 13" />
  </g>

  <!-- Typography -->
  <text x="48" y="18" class="mono" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1px">FLAGSHIP IDENTITY HUB</text>
  <text x="48" y="33" class="sans" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.3px">DIGITAL ID <tspan fill="#38bdf8" font-size="10.5" font-family="'JetBrains Mono', monospace">&#x2022; 3D PHYSICS</tspan></text>

  <!-- Pulsing Live Indicator -->
  <circle cx="320" cy="14" r="3.5" fill="#38bdf8" class="beacon" />
  <circle cx="320" cy="14" r="1.5" fill="#ffffff" />
  
  <!-- Right Launch Arrow -->
  <text x="320" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38bdf8">&#x2192;</text>
</svg>
