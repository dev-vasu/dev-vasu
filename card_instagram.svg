<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 115" width="420" height="115">
  <defs>
    <linearGradient id="bgGrad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="scanBeam_05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 0.85; transform: scale(1.1); }
    }
    .beacon {
      transform-origin: 395px 19px;
      animation: beaconPulse 2.5s ease-in-out infinite;
    }

    @keyframes radarSweep {
      0% { transform: translateX(-420px); }
      100% { transform: translateX(420px); }
    }
    .radar-line {
      animation: radarSweep 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .reticle { stroke: #475569; stroke-width: 1.2; fill: none; }
  </style>

  <rect x="1" y="1" width="418" height="113" rx="8" fill="url(#bgGrad_05)" stroke="#1e293b" stroke-width="1.2" />

  <line x1="0" y1="30" x2="160" y2="30" stroke="url(#scanBeam_05)" stroke-width="1.2" class="radar-line" />

  <path d="M 1 12 L 1 1 L 12 1" class="reticle" />
  <path d="M 407 1 L 419 1 L 419 12" class="reticle" />
  <path d="M 419 103 L 419 114 L 407 114" class="reticle" />
  <path d="M 12 114 L 1 114 L 1 103" class="reticle" />

  <path d="M 1 30 L 419 30" stroke="#1e293b" stroke-width="0.8" />
  
  <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2px">NODE // 05</text>
  
  <rect x="85" y="10" width="95" height="14" rx="3" fill="rgba(253, 164, 175, 0.08)" stroke="#fda4af" stroke-opacity="0.3" stroke-width="0.8" />
  <text x="132.5" y="20.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#fda4af" letter-spacing="1px">VISUAL FEED</text>

  <circle cx="395" cy="19" r="3.5" fill="#fda4af" class="beacon" />
  <circle cx="395" cy="19" r="1.5" fill="#ffffff" />

  <g transform="translate(18, 42)">
    <g stroke="#fda4af" stroke-width="1.6" fill="none">
          <rect x="1" y="1" width="20" height="20" rx="5" stroke-opacity="0.8" />
          <circle cx="11" cy="11" r="5" />
          <circle cx="16" cy="6" r="1" fill="#fda4af" />
        </g>
  </g>

  <g transform="translate(56, 42)">
    <text x="0" y="13" class="sans" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.3px">OPTIC PERSPECTIVE</text>
    <text x="0" y="27" class="mono" font-size="10.5" font-weight="600" fill="#fda4af">@rajput.vasudevv</text>
    <text x="0" y="40" class="mono" font-size="9" fill="#64748b">Life, Photography + Aesthetics</text>
  </g>

  <g transform="translate(268, 76)">
    <rect x="0" y="0" width="135" height="24" rx="4" fill="rgba(253, 164, 175, 0.1)" stroke="#fda4af" stroke-opacity="0.35" stroke-width="1" />
    <text x="67.5" y="15.5" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#f8fafc" letter-spacing="0.5px">VIEW VISUAL FEED &#8594;</text>
  </g>
</svg>